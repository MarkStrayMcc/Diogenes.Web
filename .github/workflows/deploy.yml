name: Deploy to Elastic Beanstalk

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Publish
      run: dotnet publish Diogenes.Web/Diogenes.Web.csproj --configuration Release --output publish

    - name: Create deployment package
      run: |
        cd publish
        zip -r ../deploy.zip .

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::707714592196:role/GitHubActions-ElasticBeanstalk-Deploy
        aws-region: eu-west-2

    - name: Upload package to S3
      run: |
        aws s3 cp deploy.zip s3://elasticbeanstalk-eu-west-2-707714592196/diogenes-web/deploy-${{ github.sha }}.zip

    - name: Create Elastic Beanstalk application version
      run: |
        aws elasticbeanstalk create-application-version \
          --application-name diogenes-web \
          --version-label deploy-${{ github.sha }} \
          --source-bundle S3Bucket=elasticbeanstalk-eu-west-2-707714592196,S3Key=diogenes-web/deploy-${{ github.sha }}.zip

    - name: Deploy to dev
      run: |
        aws elasticbeanstalk update-environment \
          --environment-name diogenes-web-dev \
          --version-label deploy-${{ github.sha }}